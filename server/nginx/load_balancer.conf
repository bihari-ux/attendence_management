# ========================================================
# Nexora High-Availability Nginx Reverse Proxy & Load Balancer
# Architecture: Layer 7 HTTP/HTTPS Load Balancer with Rate-Limiting
# ========================================================

# Rate limiting zone for auth endpoints to prevent credential stuffing / DDoS
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api_general_limit:10m rate=50r/s;

# Upstream cluster pool (Distributes traffic among multi-node instances)
upstream nexora_api_cluster {
    least_conn;                     # Routes requests to server with least active connections
    
    server 127.0.0.1:5000 max_fails=3 fail_timeout=10s weight=1;
    server 127.0.0.1:5001 max_fails=3 fail_timeout=10s weight=1 backup;
    
    keepalive 64;                   # Persistent HTTP connections to backends
}

server {
    listen 80;
    server_name api.nexora.local localhost;

    # Gzip High Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Health check probe for Cloud Load Balancers (AWS ALB, Cloudflare, etc.)
    location /api/health {
        proxy_pass http://nexora_api_cluster/api/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }

    # High-Security Rate-Limited Auth Endpoints
    location /api/auth/ {
        limit_req zone=auth_limit burst=15 nodelay;
        
        proxy_pass http://nexora_api_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # General API Routes
    location /api/ {
        limit_req zone=api_general_limit burst=50 nodelay;

        proxy_pass http://nexora_api_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # Static Client Application Proxy (if hosted on same machine)
    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
